<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="bgGlow" x1="6" y1="8" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0F9FF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="41" y1="3" x2="61" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="sparkleShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0284C7" flood-opacity="0.38" />
    </filter>
  </defs>
  <!-- 咩創意工作室統一品牌標誌底座 (Squircle Cloud Base) -->
  <rect x="6" y="8" width="50" height="50" rx="15" fill="url(#bgGlow)" stroke="#38BDF8" stroke-width="1.75" stroke-opacity="0.45" />
  <!-- 正統 Lucide Cloud 向量 (居中於超橢圓底座) -->
  <g transform="translate(17.2, 19.2) scale(1.15)" stroke="url(#skyGrad)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" />
  </g>
  <!-- 右上角微型靈感火花圓形徽章 (與 React StudioLogo 相同之浮動對角徽章) -->
  <circle cx="51" cy="13" r="10" fill="url(#sparkleGrad)" stroke="#FFFFFF" stroke-width="1.5" filter="url(#sparkleShadow)" />
  <!-- 正統 Lucide Sparkles 向量 (主星與右上/左下附星) -->
  <g transform="translate(45.72, 7.72) scale(0.44)" stroke="#FFFFFF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z" />
    <path d="M20 3v4" />
    <path d="M22 5h-4" />
    <path d="M4 17v2" />
    <path d="M5 18H3" />
  </g>
</svg>
