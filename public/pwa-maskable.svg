<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="pwaBgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4F9FF" />
      <stop offset="50%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    <linearGradient id="pwaCardGrad" x1="126" y1="126" x2="386" y2="386" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F9FF" />
    </linearGradient>
    <linearGradient id="pwaSkyGrad" x1="126" y1="126" x2="386" y2="386" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="pwaCardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0284C7" flood-opacity="0.22" />
    </filter>
  </defs>
  <!-- Full-bleed 背景確保任何形狀圓角裁切 (Maskable Safe Area) 皆無透明破綻 -->
  <rect width="512" height="512" fill="url(#pwaBgGrad)" />
  <!-- 咩創意工作室統一品牌標誌底座 (Squircle Base 嚴格收容於 80% 安全可視區內) -->
  <rect x="126" y="126" width="260" height="260" rx="78" fill="url(#pwaCardGrad)" stroke="#38BDF8" stroke-width="7.5" stroke-opacity="0.5" filter="url(#pwaCardShadow)" />
  <!-- 正統 Lucide Cloud × Infinity 純粹極簡線性向量 (Candidate F 幾何，居中於底座) -->
  <g transform="translate(186.4, 186.4) scale(5.8)" stroke="url(#pwaSkyGrad)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" />
    <path d="M12 14.5c-1.2-1.2-2.4-1.8-3.6-1.8a1.8 1.8 0 1 0 0 3.6c1.2 0 2.4-.6 3.6-1.8Zm0 0c1.2 1.2 2.4 1.8 3.6 1.8a1.8 1.8 0 0 0 0-3.6c-1.2 0-2.4.6-3.6 1.8Z" />
  </g>
</svg>
