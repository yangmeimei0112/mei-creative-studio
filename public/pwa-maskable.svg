<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="pwaBgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4F9FF" />
      <stop offset="50%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    <linearGradient id="pwaCardGrad" x1="104" y1="124" x2="384" y2="404" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F9FF" />
    </linearGradient>
    <linearGradient id="pwaSkyGrad" x1="104" y1="124" x2="384" y2="404" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="pwaSparkleGrad" x1="311" y1="89" x2="421" y2="199" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="pwaSparkleShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.35" />
    </filter>
    <filter id="pwaCardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284C7" flood-opacity="0.22" />
    </filter>
  </defs>
  <!-- Full-bleed 背景確保任何形狀圓角裁切 (Maskable Safe Area) 皆無透明破綻 -->
  <rect width="512" height="512" fill="url(#pwaBgGrad)" />
  <!-- 咩創意工作室統一品牌標誌底座 (Squircle Base 位於 80% 安全可視區內) -->
  <rect x="104" y="124" width="280" height="280" rx="85" fill="url(#pwaCardGrad)" stroke="#38BDF8" stroke-width="8" stroke-opacity="0.5" filter="url(#pwaCardShadow)" />
  <!-- 正統 Lucide Cloud 向量 (居中於底座) -->
  <g transform="translate(167.2, 187.2) scale(6.4)" stroke="url(#pwaSkyGrad)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" />
  </g>
  <!-- 右上角微型靈感火花圓形徽章 -->
  <circle cx="366" cy="144" r="55" fill="url(#pwaSparkleGrad)" stroke="#FFFFFF" stroke-width="8" filter="url(#pwaSparkleShadow)" />
  <!-- 正統 Lucide Sparkles 向量 -->
  <g transform="translate(336, 114) scale(2.5)" stroke="#FFFFFF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z" />
    <path d="M20 3v4" />
    <path d="M22 5h-4" />
    <path d="M4 17v2" />
    <path d="M5 18H3" />
  </g>
</svg>
